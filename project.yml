name: WallpaperSwap
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
  configs:
    Debug: debug
    Release: release
targets:
  WallpaperSwap:
    type: application
    platform: iOS
    sources:
      - path: WallpaperSwap
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WallpaperSwap/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: WallpaperSwap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Wallpaper Swap
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_AppGroupIdentifier: $(APP_GROUP_ID)
        INFOPLIST_KEY_CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER_ID)
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: WallpaperSwapWidget
        embed: true
        codeSign: true
  WallpaperSwapWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WallpaperSwapWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WallpaperSwapWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: WallpaperSwapWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Wallpaper Swap
        INFOPLIST_KEY_AppGroupIdentifier: $(APP_GROUP_ID)
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  WallpaperSwap:
    build:
      targets:
        WallpaperSwap: all
        WallpaperSwapWidget: all
    run:
      config: Debug
    archive:
      config: Release
